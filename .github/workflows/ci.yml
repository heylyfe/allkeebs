# Web: build and test the site, and check docs/index.html matches the source.
# Desktop: build the Tauri app for Windows and keep the installers as artifacts.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: docs/index.html is up to date
        run: git diff --exit-code --stat docs/index.html

  desktop-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      # The Rust build embeds the page and bundles the crate notices, so make them first.
      - name: Desktop page and crate notices
        run: |
          npm run build:desktop
          node tools/crate-notices.mjs
      - name: Rust checks
        working-directory: src-tauri
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Build the desktop app
        run: npx tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: allkeebs-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
